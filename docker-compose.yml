services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [reportmind]

  backend:
    build: ./backend
    restart: on-failure:5
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS}
      PROCESSING_STALE_MINUTES: ${PROCESSING_STALE_MINUTES}
      INDEXING_STALE_MINUTES: ${INDEXING_STALE_MINUTES:-60}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-reportmind_chunks_e5_small_v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_CACHE_PATH: ${EMBEDDING_CACHE_PATH:-/models}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_STATUS_TIMEOUT_SECONDS: ${OLLAMA_STATUS_TIMEOUT_SECONDS:-5}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.78}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-hybrid}
      RAG_VECTOR_POOL_SIZE: ${RAG_VECTOR_POOL_SIZE:-20}
      RAG_BM25_POOL_SIZE: ${RAG_BM25_POOL_SIZE:-20}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-10}
      AGENT_SEARCH_LIMIT: ${AGENT_SEARCH_LIMIT:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - documents_data:${DOCUMENT_STORAGE_PATH}
      - embedding_models:${EMBEDDING_CACHE_PATH:-/models}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
    networks: [reportmind]

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    restart: on-failure:5
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [reportmind]

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.1}
    restart: on-failure:5
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [reportmind]

  ollama-model:
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.1}
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [reportmind]

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    networks: [reportmind]

  demo-seed:
    build: ./backend
    command: ["python", "-m", "app.demo.seed"]
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS}
      PROCESSING_STALE_MINUTES: ${PROCESSING_STALE_MINUTES}
      INDEXING_STALE_MINUTES: ${INDEXING_STALE_MINUTES:-60}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-reportmind_chunks_e5_small_v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_CACHE_PATH: ${EMBEDDING_CACHE_PATH:-/models}
    depends_on:
      backend:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - documents_data:${DOCUMENT_STORAGE_PATH}
      - embedding_models:${EMBEDDING_CACHE_PATH:-/models}
    networks: [reportmind]

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [reportmind]

networks:
  reportmind:

volumes:
  mysql_data:
  qdrant_data:
  documents_data:
  embedding_models:
  ollama_models:
